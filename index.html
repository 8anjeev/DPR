  if('serviceWorker' in navigator){try{const sw=`const C='sr-v6';self.addEventListener('install',e=>self.skipWaiting());self.addEventListener('fetch',e=>e.respondWith(fetch(e.request).catch(()=>new Response('offline'))));`;navigator.serviceWorker.register(URL.createObjectURL(new Blob([sw],{type:'application/javascript'}))).catch(()=>{});}catch(e){}}
})();

// ── IndexedDB ────────────────────────────────────────────────
function openDB(){
  return new Promise((res,rej)=>{
    const r=indexedDB.open('SiteReportsPWA2',1);
    r.onupgradeneeded=e=>{
      const db=e.target.result;
      if(!db.objectStoreNames.contains('settings'))
        db.createObjectStore('settings',{keyPath:'key'});
      if(!db.objectStoreNames.contains('projects'))
        db.createObjectStore('projects',{keyPath:'id',autoIncrement:true});
      if(!db.objectStoreNames.contains('reports')){
        const s=db.createObjectStore('reports',{keyPath:'id',autoIncrement:true});
        s.createIndex('date','date');
        s.createIndex('projectDate',['projectId','date'],{unique:true});
      }
    };
    r.onsuccess=()=>res(r.result);
    r.onerror=()=>rej(r.error);
  });
}
async function txOp(store,mode,fn){
  const db=await openDB();
  return new Promise((res,rej)=>{
    const t=db.transaction(store,mode),s=t.objectStore(store),r=fn(s);
    if(r){r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);}
    else{t.oncomplete=()=>res();t.onerror=()=>rej(t.error);}
  });
}
const DB={
  settings:{
    get:()=>txOp('settings','readonly',s=>s.get('company')),
    save:obj=>txOp('settings','readwrite',s=>s.put({key:'company',...obj})),
  },
  projects:{
    all:()=>txOp('projects','readonly',s=>s.getAll()),
    save:p=>{
      if(p.id) return txOp('projects','readwrite',s=>s.put(p));
      const{id,...rest}=p;
      return txOp('projects','readwrite',s=>s.add(rest));
    },
    del:id=>txOp('projects','readwrite',s=>s.delete(id)),
  },
  reports:{
    byDate:async date=>{
      const db=await openDB();
      return new Promise((res,rej)=>{
        const r=db.transaction('reports','readonly').objectStore('reports').index('date').getAll(date);
        r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);
      });
    },
    save:async r=>{
      const db=await openDB();
      return new Promise((res,rej)=>{
        const t=db.transaction('reports','readwrite');
        const req=r.id?t.objectStore('reports').put(r):t.objectStore('reports').add(r);
        req.onsuccess=()=>res(req.result);req.onerror=()=>rej(req.error);
      });
    },
    del:id=>txOp('reports','readwrite',s=>s.delete(id)),
    allDates:async()=>{
      const db=await openDB();
      return new Promise((res,rej)=>{
        const r=db.transaction('reports','readonly').objectStore('reports').getAll();
        r.onsuccess=()=>res([...new Set(r.result.map(x=>x.date))].sort().reverse());
        r.onerror=()=>rej(r.error);
      });
    }
  }
};

const dataTable=(cols,rows,centerIdx)=>{
  if(!rows||!rows.length)return '';
  const ci=centerIdx||[];
  const alignFor=i=>ci.includes(i)?'center':'left';
  const ths=cols.map((c,i)=>`<th style="padding:5px 9px;text-align:${alignFor(i)};font-weight:700;color:${C.navy};font-size:9.5px;text-transform:uppercase;letter-spacing:.4px;background:${C.cloud};border-radius:${i===0?'7px 0 0 7px':i===cols.length-1?'0 7px 7px 0':'0'}">${c}</th>`).join('');
  const trs=rows.map((row,ri)=>`<tr>${row.map((cell,colIdx)=>`<td style="padding:5px 9px;text-align:${alignFor(colIdx)};color:${colIdx===0?C.ink:C.slate};font-weight:${colIdx===0?600:400};border-bottom:${ri<rows.length-1?`1px solid ${C.border}`:'none'}">${cell}</td>`).join('')}</tr>`).join('');
  return `<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:12px"><thead><tr>${ths}</tr></thead><tbody>${trs}</tbody></table></div>`;
};

}

  const reqRows=(report.matRequired||[]).filter(m=>m.material).map(m=>[esc(m.material),`${esc(m.qty)} ${esc(m.unit||'')}`.trim()]);

            ${project.address?`<div style="color:rgba(255,255,255,.72);font-size:11.5px;margin-top:1px">${esc(project.address)}</div>`:''}
          </div>
        </div>
        <div style="display:flex;gap:5px;flex-shrink:0;margin-left:8px">
          ${ibtn(IC.eye,`viewRpt(${pid},${rid})`,'rgba(255,255,255,.15)','white','View')}

      </div>

    <div style="padding:13px 14px">
      ${(report.weather||report.siteNote)?`<div style="background:#FFFBEB;border:1px solid #FDE68A;border-radius:10px;padding:9px 12px;margin-bottom:13px;display:flex;gap:8px;align-items:flex-start"><span>☀️</span><div style="font-size:12.5px"><span style="font-weight:700;color:#92400E">${esc(report.weather)}</span>${report.siteNote?`<span style="color:#78350F"> — ${esc(report.siteNote)}</span>`:''}</div></div>`:''}
      ${lRows.length?`<div style="margin-bottom:13px">${secHead('👷','Labour Summary')}${dataTable(['Category','Count','Floor','Work Done'],lRows,[1])}</div>`:''}
      ${dRows.length?`<div style="margin-bottom:13px">${secHead('🏗️','Departmental Work')}${dataTable(['Category','Workers','Floor','Work Done'],dRows,[1])}</div>`:''}
      ${mRows.length?`<div style="margin-bottom:13px">${secHead('🛒','Materials Received')}${dataTable(['Material','Qty'],mRows,[1])}</div>`:''}
      ${reqRows.length?`<div style="margin-bottom:13px">${secHead('📋','Material Required')}${dataTable(['Material','Qty'],reqRows,[1])}</div>`:''}

}

    ${reqRows.length?`<div style="background:${C.white};border-radius:14px;padding:13px 14px;margin-bottom:12px;box-shadow:0 1px 8px ${C.ink}07">${secHead('📋','Material Required')}${dataTable(['Material','Qty'],reqRows,[1])}</div>`:''}

// ═══════════════════════════════════════════════════════════════
// PHOTO HANDLING — resize client-side before storing in IndexedDB
// ═══════════════════════════════════════════════════════════════
function resizeImageFile(file,maxWidth=1000,quality=0.75){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=e=>{
      const img=new Image();
      img.onload=()=>{
        let w=img.width,h=img.height;
        if(w>maxWidth){h=Math.round(h*(maxWidth/w));w=maxWidth;}
        const canvas=document.createElement('canvas');
        canvas.width=w;canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg',quality));
      };
      img.onerror=()=>reject(new Error('Image load failed'));
      img.src=e.target.result;
    };
    reader.onerror=()=>reject(new Error('File read failed'));
    reader.readAsDataURL(file);
  });
}
async function onPhotoInputChange(input){
  const files=Array.from(input.files||[]);
  if(!files.length)return;
  if(!formState.photos)formState.photos=[];
  const room=MAX_PHOTOS-formState.photos.length;
  if(room<=0){alert(`Maximum ${MAX_PHOTOS} photos allowed per site report.`);input.value='';return;}
  const toProcess=files.slice(0,room);
  if(files.length>room) alert(`Only ${room} more photo(s) could be added (max ${MAX_PHOTOS} total). Extra photos were skipped.`);
  for(const f of toProcess){
    try{
      const dataUrl=await resizeImageFile(f);
      formState.photos.push({id:uid(),src:dataUrl});
    }catch(e){console.error('Photo processing failed',e);}
  }
  input.value='';
  // Re-render just the photo section so the rest of the form (typed text) isn't disturbed
  state.view='form';render();
}
function removePhoto(id){
  formState.photos=(formState.photos||[]).filter(p=>p.id!==id);
  state.view='form';render();
}

// PRINT / PDF GENERATION — isolated hidden <iframe>, prints ONLY
// the generated report (never the surrounding app/page content).
// Header: Engineer (left) | Company name+address+DPR title (center) | Date+Day (right)
// Body: per-project content blocks in series — no monetary amounts
// Each site ends with its own 2-row x 4-col photo grid (max 8 photos)
// before the divider that leads into the next site's section.
// Missing report for the date => auto "SITE CLOSED TODAY"
// ═══════════════════════════════════════════════════════════════

    <div style="flex:1.3;text-align:left">
      <div style="font-size:15px;font-weight:900;color:#fff;letter-spacing:.3px;line-height:1.15">${esc(co.companyName||'Company Name')}</div>
      ${co.companyAddress?`<div style="font-size:10px;color:rgba(255,255,255,.75);margin-top:1px">${esc(co.companyAddress)}</div>`:''}
    </div>
    <div style="flex:1;text-align:center">
      <div style="font-size:11.5px;font-weight:800;color:#fff">${fmtDate(date)}</div>
      <div style="font-size:10px;color:rgba(255,255,255,.75)">${fmtDay(date)}</div>
    </div>
    <div style="flex:1.1;text-align:right">
      <div style="font-size:8px;color:rgba(255,255,255,.55);text-transform:uppercase;letter-spacing:1px;font-weight:700;margin-bottom:1px">DPR Prepared By</div>
      <div style="font-size:11.5px;font-weight:800;color:#fff">Er. ${esc(co.engineerName||'—')}</div>
    </div>

}

function printSiteSectionHTML(project,report){
  let html=`<div style="margin-bottom:14px;page-break-inside:avoid">`;
  html+=`<div style="background:linear-gradient(135deg,${C.ink} 0%,${C.navy} 55%,${C.royal} 100%);border-radius:7px;padding:5px 12px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;gap:10px">
    <div style="font-size:13px;font-weight:800;color:#fff;white-space:nowrap">${esc(project.name)}</div>
    ${project.address?`<div style="font-size:10.5px;color:rgba(255,255,255,.8);text-align:right">${esc(project.address)}</div>`:''}
  </div>`;

  if(!report){
    html+=`<div style="background:#FEF2F2;border:1.5px dashed #FCA5A5;border-radius:9px;padding:13px;text-align:center">
      <div style="font-size:13px;font-weight:800;color:#B91C1C;letter-spacing:.5px">🔒 SITE CLOSED TODAY</div>
      <div style="font-size:11px;color:#991B1B;margin-top:3px">No work reported for this date</div>
    </div></div>`;
    return html;
  }

  if(report.weather||report.siteNote){
    html+=`<div style="background:#FFFBEB;border:1px solid #FDE68A;border-radius:9px;padding:7px 11px;margin-bottom:9px">
      <span style="font-weight:800;color:#92400E;font-size:11.5px">${esc(report.weather||'')}</span>
      ${report.siteNote?`<span style="color:#78350F;font-size:11.5px"> — ${esc(report.siteNote)}</span>`:''}
    </div>`;
  }

  const lRows=(report.labour||[]).filter(l=>l.category).map(l=>[esc(l.category),esc(l.count),esc(l.floor),esc(l.workDone)]);
  if(lRows.length) html+=`<div style="margin-bottom:9px">${secHead('👷','Labour Summary')}${dataTable(['Category','Count','Floor','Work Done'],lRows,[1])}</div>`;

  const dW=(report.deptWork||[]).reduce((s,d)=>s+(Number(d.workers)||0),0);
  const dRowsBase=(report.deptWork||[]).filter(d=>d.category).map(d=>[esc(d.category),esc(d.workers),esc(d.floor),esc(d.workDone)]);
  if(dRowsBase.length){
    const dRows=[...dRowsBase,...(dW>0?[[`<strong>Total</strong>`,dW,'','']]:[])];
    html+=`<div style="margin-bottom:9px">${secHead('🏗️','Departmental Work')}${dataTable(['Category','Workers','Floor','Work Done'],dRows,[1])}</div>`;
  }

  const mRows=(report.matBought||[]).filter(m=>m.material).map(m=>[esc(m.material),`${esc(m.qty)} ${esc(m.unit||'')}`.trim()]);
  if(mRows.length) html+=`<div style="margin-bottom:9px">${secHead('🛒','Materials Received')}${dataTable(['Material','Qty'],mRows,[1])}</div>`;

  const reqRows=(report.matRequired||[]).filter(m=>m.material).map(m=>[esc(m.material),`${esc(m.qty)} ${esc(m.unit||'')}`.trim()]);
  if(reqRows.length) html+=`<div style="margin-bottom:9px">${secHead('📋','Material Required')}${dataTable(['Material','Qty'],reqRows,[1])}</div>`;

  if(!lRows.length&&!dRowsBase.length&&!mRows.length&&!reqRows.length&&!(report.photos&&report.photos.length)){
    html+=`<div style="font-size:11px;color:${C.fog};font-style:italic;padding:2px 0">No detailed work logged for this site today.</div>`;
  }

  // Photo grid — always the LAST element of a site's block, right before the
  // divider that leads into the next site's DPR section.
  if(report.photos&&report.photos.length){
    html+=`<div style="margin-top:3px">${photoGridView(report.photos)}</div>`;
  }

  html+=`</div>`;
  return html;
}

function buildPrintBody(date,items){
  const co=state.company;
  const sections=items.map(it=>printSiteSectionHTML(it.project,it.report))
    .join(`<div style="height:1px;background:${C.border};margin:0 0 14px"></div>`);
  const signature=`<div style="margin-top:16px;page-break-inside:avoid">
    ${co.signature?`<img src="${co.signature}" style="height:46px;display:block;margin-bottom:3px">`:''}
    <div style="font-size:11px;font-weight:700;color:${C.slate}">Site Engineer</div>
  </div>`;
  return `<div style="font-family:-apple-system,'Segoe UI',Arial,sans-serif;color:${C.ink};width:100%">
    ${printHeaderHTML(date,co)}
    ${sections}
    ${signature}
  </div>`;
}

// Print via an isolated hidden <iframe> so ONLY this generated report is
// ever sent to the printer — never the surrounding app/page content.
function doPrint(bodyHtml){
  if(printFrame){try{printFrame.remove();}catch(e){}printFrame=null;}
  printFrame=document.createElement('iframe');
  printFrame.setAttribute('aria-hidden','true');
  printFrame.style.position='fixed';
  printFrame.style.right='0';
  printFrame.style.bottom='0';
  printFrame.style.width='0';
  printFrame.style.height='0';
  printFrame.style.border='0';
  document.body.appendChild(printFrame);

  const fullHtml=`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Daily Progress Report</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,'Segoe UI',Arial,sans-serif}
    *{-webkit-print-color-adjust:exact;print-color-adjust:exact;color-adjust:exact}
    body{padding:10mm 8mm;color:${C.ink};background:#fff}
    table{width:100%;border-collapse:collapse}
    img{display:block}
    @page{size:auto;margin:0}
    html,body{width:100%}
    @media print{
      *{-webkit-print-color-adjust:exact !important;print-color-adjust:exact !important;color-adjust:exact !important}
    }
  </style></head><body>${bodyHtml}</body></html>`;

  const doc=printFrame.contentWindow.document;
  doc.open();doc.write(fullHtml);doc.close();

  let fired=false;
  const fire=()=>{
    if(fired)return;fired=true;
    try{
      printFrame.contentWindow.focus();
      printFrame.contentWindow.print();
    }catch(e){console.error('Print failed',e);}
  };
  try{
    printFrame.contentWindow.onafterprint=()=>{ if(printFrame){printFrame.remove();printFrame=null;} };
  }catch(e){}
  printFrame.onload=fire;
  setTimeout(fire,500); // fallback for browsers that don't fire onload reliably after doc.write
}

function printAllSites(){
  if(state.projects.length===0){alert('No projects added yet. Add projects from Settings first.');return;}
  const items=state.projects.map(p=>({project:p,report:state.reports.find(r=>r.projectId===p.id)||null}));
  doPrint(buildPrintBody(state.date,items));
}
function printSingleSite(){
  doPrint(buildPrintBody(state.date,[{project:state.activeProject,report:state.activeReport}]));
}

// ═══════════════════════════════════════════════════════════════
// RENDER
// ═══════════════════════════════════════════════════════════════
function render(){
  let html='';
  if(state.view==='dashboard')      html=viewDashboard();
  else if(state.view==='settings')  html=viewSettings();
  else if(state.view==='form')      html=viewForm();
  else if(state.view==='detail')    html=viewDetail();
  if(state.confirm){
    const c=state.confirm;
    const disabled=c.countdown>0;
    html+=`<div style="position:fixed;inset:0;background:rgba(30,20,88,.55);display:flex;align-items:center;justify-content:center;z-index:999;padding:20px">
      <div style="background:${C.white};border-radius:20px;padding:28px 24px;max-width:300px;width:100%;box-shadow:0 20px 60px ${C.ink}40">
        <div style="font-size:15px;font-weight:700;color:${C.ink};margin-bottom:8px">⚠️ Confirm Delete</div>
        <div style="font-size:13px;color:${C.slate};margin-bottom:20px">${c.msg}</div>
        <div style="display:flex;gap:10px">
          <button id="confirmDeleteBtn" onclick="cfOk()" ${disabled?'disabled':''} style="flex:1;padding:11px;border-radius:10px;border:none;font-weight:700;font-size:13px;cursor:${disabled?'not-allowed':'pointer'};background:${disabled?'#9CA3AF':'linear-gradient(135deg,#DC2626,#EF4444)'};color:white">${disabled?`Wait ${c.countdown}s…`:'Delete'}</button>
          <button onclick="cfNo()" style="flex:1;padding:11px;border-radius:10px;font-weight:700;font-size:13px;cursor:pointer;background:transparent;color:${C.navy};border:1.5px solid ${C.border}">Cancel</button>
        </div>
      </div>
    </div>`;
  }
  document.getElementById('app').innerHTML=html;
  window.scrollTo(0,0);
  if(state.view==='settings'&&state.settingsView==='editCompany'){
    requestAnimationFrame(initSignaturePad);
  }
}

// ── E-signature pad (canvas) ────────────────────────────────────
function initSignaturePad(){
  const canvas=document.getElementById('sigCanvas');
  if(!canvas)return;
  const rect=canvas.getBoundingClientRect();
  const dpr=window.devicePixelRatio||1;
  canvas.width=Math.max(1,rect.width)*dpr;
  canvas.height=Math.max(1,rect.height)*dpr;
  const ctx=canvas.getContext('2d');
  ctx.scale(dpr,dpr);
  ctx.strokeStyle=C.ink;
  ctx.lineWidth=2.2;
  ctx.lineCap='round';
  ctx.lineJoin='round';

  if(state.companyForm.signature){
    const img=new Image();
    img.onload=()=>{ try{ctx.drawImage(img,0,0,rect.width,rect.height);}catch(e){} };
    img.src=state.companyForm.signature;
  }

  let drawing=false,lastX=0,lastY=0,moved=false;
  const pos=e=>{
    const r=canvas.getBoundingClientRect();
    return [e.clientX-r.left, e.clientY-r.top];
  };
  const start=e=>{drawing=true;moved=false;[lastX,lastY]=pos(e);e.preventDefault();};
  const move=e=>{
    if(!drawing)return;
    const[x,y]=pos(e);
    ctx.beginPath();ctx.moveTo(lastX,lastY);ctx.lineTo(x,y);ctx.stroke();
    [lastX,lastY]=[x,y];moved=true;e.preventDefault();
  };
  const end=()=>{
    if(drawing&&moved){state.companyForm.signature=canvas.toDataURL('image/png');}
    drawing=false;
  };
  canvas.onpointerdown=start;
  canvas.onpointermove=move;
  canvas.onpointerup=end;
  canvas.onpointerleave=end;
}
function clearSignature(){
  const canvas=document.getElementById('sigCanvas');
  if(canvas){const ctx=canvas.getContext('2d');ctx.clearRect(0,0,canvas.width,canvas.height);}
  state.companyForm.signature='';
}

// ── Delete confirmation with mandatory 3-second wait ───────────
function openConfirm(msg,k,v){
  if(confirmTimer){clearInterval(confirmTimer);confirmTimer=null;}
  state.confirm={msg,k,v,countdown:3};
  render();
  confirmTimer=setInterval(()=>{
    if(!state.confirm){clearInterval(confirmTimer);confirmTimer=null;return;}
    state.confirm.countdown--;
    const btn=document.getElementById('confirmDeleteBtn');
    if(state.confirm.countdown<=0){
      clearInterval(confirmTimer);confirmTimer=null;
      if(btn){
        btn.disabled=false;btn.textContent='Delete';
        btn.style.cursor='pointer';
        btn.style.background='linear-gradient(135deg,#DC2626,#EF4444)';
      }
    }else if(btn){
      btn.textContent=`Wait ${state.confirm.countdown}s…`;
    }
  },1000);
}
function delProject(id){openConfirm('Delete this project? Its saved reports will remain in storage but the project will no longer appear. This cannot be undone.','prj',id);}

function cfOk(){
  if(!state.confirm||state.confirm.countdown>0)return;
  if(confirmTimer){clearInterval(confirmTimer);confirmTimer=null;}
  const c=state.confirm;state.confirm=null;
  if(c.k==='prj')DB.projects.del(c.v).then(async()=>{state.projects=await DB.projects.all();render();});
}
function cfNo(){
  if(confirmTimer){clearInterval(confirmTimer);confirmTimer=null;}
  state.confirm=null;render();
}
